name: Anime Friends Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/anime-friends

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend syntax
        run: npm run check --prefix backend

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Firebase Android app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python -c 'import json; d=json.load(open("android/app/google-services.json")); assert any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.animefriends.app" for c in d.get("client", [])), "Wrong Firebase package"; print("Firebase Android configuration verified.")'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Upload resolved Flutter lockfile
        uses: actions/upload-artifact@v4
        with:
          name: anime-friends-pubspec-lock
          path: pubspec.lock
          retention-days: 7
          if-no-files-found: error

      - name: Format Dart files
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          --dart-define=MAL_CLIENT_ID="${{ secrets.MAL_CLIENT_ID }}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-friends-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
